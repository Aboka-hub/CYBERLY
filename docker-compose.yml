version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: CYBERLY
    restart: always
    environment:
      POSTGRES_DB: cyberly_db
      POSTGRES_USER: cyberly
      POSTGRES_PASSWORD: cyberly
    ports:
      - "5567:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
