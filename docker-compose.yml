version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: cyberly-db
    restart: always
    environment:
      POSTGRES_DB: cyberly_db
      POSTGRES_USER: cyberly
      POSTGRES_PASSWORD: cyberly
    ports:
      - "5567:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberly -d cyberly_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend-cyberly
      dockerfile: Dockerfile
    container_name: cyberly-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cyberly_db
      SPRING_DATASOURCE_USERNAME: cyberly
      SPRING_DATASOURCE_PASSWORD: cyberly
      JWT_SECRET: cyberly-secret-key-change-in-production-min-32-chars
      CORS_ORIGINS: http://localhost:4200
      MAX_FAILED_ATTEMPTS: 5
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
