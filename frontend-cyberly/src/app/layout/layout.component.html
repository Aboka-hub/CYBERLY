<div class="shell">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sb-top">
      <div class="sb-brand">
        <div class="sb-ico">
          <svg viewBox="0 0 18 18" fill="none">
            <path d="M9 1.5L16 5.5V12.5L9 16.5L2 12.5V5.5L9 1.5Z" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
            <circle cx="9" cy="9" r="2.5" fill="#fff"/>
          </svg>
        </div>
        <span class="sb-name">Cyberly</span>
      </div>
    </div>

    <nav class="sb-nav">
      <div class="sb-lbl">Обзор</div>
      <a class="sb-item" routerLink="/dashboard" routerLinkActive="on" [routerLinkActiveOptions]="{exact:true}">
        <svg viewBox="0 0 14 14" fill="none"><rect x="1" y="1" width="5" height="5" rx="1.5" stroke="currentColor" stroke-width="1.3"/><rect x="8" y="1" width="5" height="5" rx="1.5" stroke="currentColor" stroke-width="1.3"/><rect x="1" y="8" width="5" height="5" rx="1.5" stroke="currentColor" stroke-width="1.3"/><rect x="8" y="8" width="5" height="5" rx="1.5" stroke="currentColor" stroke-width="1.3"/></svg>
        Dashboard
      </a>
      <a class="sb-item" routerLink="/events" routerLinkActive="on">
        <svg viewBox="0 0 14 14" fill="none"><path d="M1 4h12M1 7h8M1 10h5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        События
      </a>
      <a class="sb-item" routerLink="/risk" routerLinkActive="on">
        <svg viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.3"/><path d="M7 4v3l2 1.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        Риск-анализ
      </a>
      <div class="sb-lbl">Аккаунт</div>
      <a class="sb-item" routerLink="/profile" routerLinkActive="on">
        <svg viewBox="0 0 14 14" fill="none"><circle cx="7" cy="4.5" r="2.5" stroke="currentColor" stroke-width="1.3"/><path d="M2 12c0-2.8 2.2-5 5-5s5 2.2 5 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        Профиль
      </a>
      <a class="sb-item" routerLink="/subscriptions" routerLinkActive="on">
        <svg viewBox="0 0 14 14" fill="none"><rect x="1" y="3" width="12" height="8" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M1 6h12" stroke="currentColor" stroke-width="1.3"/></svg>
        Подписки
      </a>
    </nav>

    <div class="sb-bottom">
      <div class="sb-user">
        <div class="avatar">{{ auth.getEmail().charAt(0).toUpperCase() }}</div>
        <div class="u-info">
          <div class="u-name">{{ auth.getEmail() }}</div>
          <div class="u-role">{{ auth.getStatus() }}</div>
        </div>
        <button class="logout-btn" (click)="auth.logout()" title="Выйти">
          <svg viewBox="0 0 14 14" fill="none"><path d="M9 7H3M9 7L7 5M9 7L7 9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 4V3a1 1 0 011-1h4a1 1 0 011 1v8a1 1 0 01-1 1H6a1 1 0 01-1-1v-1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- PAGE CONTENT -->
  <router-outlet></router-outlet>

</div>
