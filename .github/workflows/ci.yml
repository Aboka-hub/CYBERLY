name: CYBERLY CI

on:
  push:
    branches: [ main, claude/check-code-visibility-eNWPZ ]
  pull_request:
    branches: [ main ]

jobs:

  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build backend
        working-directory: backend-cyberly
        run: mvn clean install -DskipTests

      - name: Run tests
        working-directory: backend-cyberly
        run: mvn test
        continue-on-error: true

  frontend:
    name: Frontend — Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-cyberly/package-lock.json

      - name: Install dependencies
        working-directory: frontend-cyberly
        run: npm ci

      - name: Build frontend
        working-directory: frontend-cyberly
        run: npm run build
