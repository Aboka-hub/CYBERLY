server:
  servlet:
    context-path: /api

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5567/cyberly_db}
    username: ${SPRING_DATASOURCE_USERNAME:cyberly}
    password: ${SPRING_DATASOURCE_PASSWORD:cyberly}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: ${JWT_SECRET:cyberly-secret-key-change-in-production-min-32-chars}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

app:
  max-failed-attempts: ${MAX_FAILED_ATTEMPTS:5}
