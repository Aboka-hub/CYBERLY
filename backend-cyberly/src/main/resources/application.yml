server:
  servlet:
    context-path: /api
spring:
  datasource:
    url: jdbc:postgresql://localhost:5567/cyberly_db
    username: cyberly
    password: cyberly
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: ${JWT_SECRET:cyberly-secret-key-change-in-production-min-32-chars}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:4200}